<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - ISA Admin Panel</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <style>
        :root {
            --primary: #2563eb;
            --primary-dark: #1d4ed8;
            --surface: #ffffff;
            --background: #f1f5f9;
            --text-main: #0f172a;
            --text-muted: #64748b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #f1f5f9 0%, #e2e8f0 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            color: var(--text-main);
        }

        .login-container {
            background: var(--surface);
            padding: 40px;
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.05), 0 1px 3px rgba(0,0,0,0.05);
            width: 100%;
            max-width: 420px;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .login-container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 6px;
            background: linear-gradient(90deg, var(--primary), #60a5fa);
        }

        .logo-circle {
            width: 72px;
            height: 72px;
            background: #eff6ff;
            color: var(--primary);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            margin: 0 auto 24px auto;
        }

        h1 {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 8px;
            color: var(--text-main);
        }

        p.subtitle {
            color: var(--text-muted);
            font-size: 14px;
            margin-bottom: 32px;
        }

        .input-group {
            text-align: left;
            margin-bottom: 20px;
        }

        .input-group label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 8px;
            color: var(--text-muted);
        }

        .input-wrapper {
            position: relative;
        }

        .input-wrapper i {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: #94a3b8;
            font-size: 18px;
        }

        .input-wrapper input {
            width: 100%;
            padding: 14px 16px 14px 44px;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            font-size: 14px;
            transition: all 0.2s;
            outline: none;
            background: #f8fafc;
        }

        .input-wrapper input:focus {
            border-color: var(--primary);
            background: white;
            box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.1);
        }

        .btn-login {
            background: var(--primary);
            color: white;
            border: none;
            width: 100%;
            padding: 14px;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            margin-top: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-login:hover {
            background: var(--primary-dark);
            transform: translateY(-1px);
        }

        .btn-login:active {
            transform: translateY(1px);
        }

        .error-msg {
            color: #ef4444;
            background: #fef2f2;
            padding: 12px;
            border-radius: 8px;
            font-size: 13px;
            margin-bottom: 20px;
            display: none;
            border: 1px solid #fecaca;
        }
        
        .footer {
            margin-top: 32px;
            font-size: 12px;
            color: #94a3b8;
        }
    </style>
</head>
<body>

    <div class="login-container">
        <div class="logo-circle">
            <i class="ph ph-robot"></i>
        </div>
        <h1>ISA Admin Panel</h1>
        <p class="subtitle">Silakan masuk untuk mengelola sistem AI.</p>

        <div id="error-box" class="error-msg">
            <i class="ph ph-warning-circle"></i> Username atau password salah.
        </div>

        <form id="login-form">
            <div class="input-group">
                <label>Username</label>
                <div class="input-wrapper">
                    <i class="ph ph-user"></i>
                    <input type="text" id="username" placeholder="Masukkan username" required autocomplete="off">
                </div>
            </div>

            <div class="input-group">
                <label>Password</label>
                <div class="input-wrapper">
                    <i class="ph ph-lock-key"></i>
                    <input type="password" id="password" placeholder="Masukkan password" required>
                </div>
            </div>

            <button type="submit" class="btn-login" id="btn-submit">
                Masuk ke Dasbor <i class="ph ph-arrow-right"></i>
            </button>
        </form>
        
        <div class="footer">
            &copy; 2026 Politeknik Indonusa Surakarta
        </div>
    </div>

    <script>
        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const user = document.getElementById('username').value;
            const pass = document.getElementById('password').value;
            const btn = document.getElementById('btn-submit');
            const errorBox = document.getElementById('error-box');
            
            btn.innerHTML = '<i class="ph ph-spinner ph-spin"></i> Memverifikasi...';
            btn.disabled = true;
            errorBox.style.display = 'none';

            try {
                // Buat form data untuk fastapi OAuth2PasswordRequestForm
                const formData = new FormData();
                formData.append('username', user);
                formData.append('password', pass);

                const res = await fetch('/api/login', {
                    method: 'POST',
                    body: formData
                });

                if (res.ok) {
                    window.location.href = '/admin';
                } else {
                    errorBox.style.display = 'block';
                    btn.innerHTML = 'Masuk ke Dasbor <i class="ph ph-arrow-right"></i>';
                    btn.disabled = false;
                }
            } catch (err) {
                errorBox.innerHTML = '<i class="ph ph-warning-circle"></i> Terjadi kesalahan koneksi.';
                errorBox.style.display = 'block';
                btn.innerHTML = 'Masuk ke Dasbor <i class="ph ph-arrow-right"></i>';
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>
